# 60時間超区分の施行後(中小企業・2023-04、施行日2023-04-01当日から)— overtime60h が計算される。
name: 法令結線 — 中小企業の60時間超区分は2023-04-01以降は有効(計算される)
law_reference: 労働基準法37条1項ただし書(中小企業への適用は2023-04-01、packages/law/src/versions.ts 参照)
settings:
  tz_offset: 540
  day_boundary: "00:00"
  legal_holiday: { dates: [] } # このケースでは法定休日を無関係にするため暦日指定・空配列にする
  flex: { settlement: monthly, core: null, standard_day: "08:00" }
  break_rule: { mode: punch }
period: 2023-04
law: { is_small_or_medium_enterprise: true }
