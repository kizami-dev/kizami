expected:
  # 手計算:
  # 2023-04は30日: frame = floor(2400*30/7) = 10285分(flex-basic.yamlと同じ月)
  # worked合計 = 18日 * 900分 = 16200分。actual = 16200(有給なし)
  # overtime = max(0, 16200-10285) = 5915分
  # overtime60h: 中小企業の60時間超区分は2023-04-01施行、この月は施行日当日から含むので有効
  #   → max(0, 5915-3600) = 2315分
  # diff = 16200 - 10285 = 5915
  totals: { statutory: 10285, overtime: 5915, overtime60h: 2315, lateNight: 0, statutoryHoliday: 0 }
  flex_balance: { frame: 10285, actual: 16200, diff: 5915 }
  # 18日分すべて実労働900分(15時間)・休憩0分 → 各区間で8時間超60分の休憩が必要なところ
  # 不足しているため、区間ごとに insufficient_break が1件ずつ(計18件)出る。
  warnings:
    [
