# フレックス基本 — 打刻ゼロの月。総枠の計算だけを固定する
name: フレックス基本 — 空の月の総枠
law_reference: 労働基準法32条の3(フレックスタイム制)
settings:
  tz_offset: 540
  day_boundary: "00:00"
  legal_holiday: { weekday: sunday }
  flex: { settlement: monthly, core: null, standard_day: "08:00" }
  break_rule: { mode: punch }
period: 2026-04
paid_leave_days: []
punches: []
expected:
  # 2026-04 は30日: frame = floor(40h*60 * 30 / 7) = floor(10285.71) = 10285
  totals: { statutory: 0, overtime: 0, overtime60h: 0, lateNight: 0, statutoryHoliday: 0 }
  flex_balance: { frame: 10285, actual: 0, diff: -10285 }
  warnings: []
