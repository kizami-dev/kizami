# 上乗せすると翌月の法定の枠を超える場合の切り詰め。
# 8月に60時間しか働かず不足60時間。9月の上乗せの余地は 法定の枠 − 契約上の枠 = 3445分 しかないので、
# 繰り越せるのは3445分まで。残り155分は8月の不足として確定する(給与で控除する対象)。
name: 不足の繰越 — 翌月の法定の枠を超える分は繰り越さず、その月の不足として確定する
law_reference: 労働基準法32条の3、昭和63年1月1日 基発1号
settings:
  tz_offset: 540
  day_boundary: "00:00"
  legal_holiday: { weekday: sunday }
  flex: { standard_day: "06:00", total_hours_basis: scheduled_days, carry_over_shortfall: true }
calendar: { weekdays: [saturday, sunday], national_holidays: true }
months:
  - period: 2026-08
    work:
      - { dates: scheduled, in: "09:00", out: "12:00" } # 3時間 × 20日 = 3600
    expected:
      scheduled_work_days: 20
      # 不足 = 7200 − 3600 = 3600
      # 9月: 30日・土日8日・祝日3日(9/21 敬老の日・9/22 国民の休日・9/23 秋分の日)→ 所定19日
      #   法定の枠 floor(2400 × 30 / 7) = 10285、契約上の枠 19 × 360 = 6840、余地 = 3445
      # 繰り越す分 = min(3600, 3445) = 3445、確定する不足 = 155
      totals: { statutory: 3600, overtime: 0, overtime60h: 0, lateNight: 0, statutoryHoliday: 0 }
      flex_balance:
        { frame: 7200, actual: 3600, diff: -3600, statutory_frame: 10628, contract_frame: 7200, carry_in: 0, within_statutory_excess: 0, carry_out: 3445, confirmed_shortfall: 155 }
      warnings: []
  - period: 2026-09
    next_period_capacity: 0
    work:
      - { dates: scheduled, in: "09:00", out: "19:00", break: ["12:00", "13:00"] } # 9時間 × 19日 = 10260
    expected:
      scheduled_work_days: 19
      # 枠 = 6840 + 3445 = 10285(= 法定の枠。上乗せ後も法定の枠を超えない)
      # 実績 10260 → 不足 25。翌月の余地0なので全額この月で確定
      totals: { statutory: 10260, overtime: 0, overtime60h: 0, lateNight: 0, statutoryHoliday: 0 }
      flex_balance:
        { frame: 10285, actual: 10260, diff: -25, statutory_frame: 10285, contract_frame: 6840, carry_in: 3445, within_statutory_excess: 0, carry_out: 0, confirmed_shortfall: 25 }
      warnings: []
