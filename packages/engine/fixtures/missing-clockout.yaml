# 退勤なしの日を含む。区間除外(その日の労働時間が0になる)と missing_clock_out 警告を固定する。
name: 退勤打刻漏れ — 未完の勤務区間は集計から除外
law_reference: v01-data-model.md 不正打刻列の解釈ルール(保守的解釈)
settings:
  tz_offset: 540
  day_boundary: "00:00"
  legal_holiday: { weekday: sunday }
  flex: { settlement: monthly, core: null, standard_day: "08:00" }
  break_rule: { mode: punch }
period: 2026-04
paid_leave_days: []
punches:
  # 2026-04-06(月): 通常通り出退勤(完結)
  - { kind: clock_in,  at: "2026-04-06T09:00" }
  - { kind: clock_out, at: "2026-04-06T18:00" }
  # 2026-04-07(火): 出勤のみ、退勤打刻なしで打刻列が終わる → 未完の勤務区間
  - { kind: clock_in,  at: "2026-04-07T09:00" }
expected:
  # 手計算:
  # 04-06: 09:00-18:00 = 540分、休憩なし → worked=540
  # 04-07: clock_in のまま打刻列が終端 → 区間全体を破棄(worked=0)、missing_clock_out 警告
  #   警告の対象打刻は 04-07T09:00 の clock_in、帰属勤怠日は 2026-04-07(day_boundary 00:00 なので暦日と同じ)
  # actual = 540(04-06) + 0(04-07破棄) + 0(有給なし) = 540
  # frame = 10285 / diff = 540 - 10285 = -9745
  totals: { statutory: 540, overtime: 0, overtime60h: 0, lateNight: 0, statutoryHoliday: 0 }
  flex_balance: { frame: 10285, actual: 540, diff: -9745 }
  warnings: ["missing_clock_out"]
  days:
    - { date: "2026-04-06", worked: 540, break: 0, late_night: 0, legal_holiday: false }
    - { date: "2026-04-07", worked: 0, break: 0, late_night: 0, legal_holiday: false }
