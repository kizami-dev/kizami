name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # docs:api が失敗する = 公開APIが壊れたリンク({@link})や非公開の型を露出させている
      # (設計の綻び)。docs:build は typedoc 生成物を含めた VitePress のフルビルドまで検証する。
      - run: pnpm docs:build

      # Future: Add matrix tests across Node versions and runtimes
      # e.g. Node/workerd × SQLite/PostgreSQL/D1 combinations
