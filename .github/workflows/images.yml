name: Container Images

# Builds & pushes the multi-arch (linux/amd64 + linux/arm64) KIZAMI images
# to GHCR: ghcr.io/kizami-dev/kizami-api and ghcr.io/kizami-dev/kizami-web.
#
# The build itself lives in build-images.yml (shared with release.yml): each arch is
# built natively on its own runner and the digests are merged into one tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      sha-tag: true
