# api + web + worker(打刻忘れリマインドの定期スキャン, apps/api/src/worker.ts)を
# 同一 Pod にまとめたシングル Deployment。
# SQLite ファイルDB + RWO の PVC のため replicas は 1 固定、更新戦略も
# Recreate(RollingUpdate だと新旧 Pod が同時に same PVC を掴もうとして
# 片方が Pending のまま詰まる)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kizami
  namespace: kizami
  labels:
    app: kizami
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kizami
  template:
    metadata:
      labels:
        app: kizami
    spec:
      # local-path が新規プロビジョニングする PVC はデフォルト root 所有
      # になるため、api コンテナ内の非 root ユーザー(uid/gid 1001,
      # docker/api.Dockerfile 参照)から /data に書き込めるよう
      # fsGroup を合わせておく(k8s がマウント時にグループ所有権を付け替える)。
      securityContext:
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/sasagar/kizami-api:latest
          ports:
            - name: api-http
              containerPort: 3001
          env:
            - name: DATABASE_URL
              value: file:/data/kizami.db
            # COOKIE_SECURE は未設定=既定 true(Secure Cookie)のまま。
            # Cloudflare Tunnel 経由(HTTPS)前提のため既定を維持する。
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: web
          image: ghcr.io/sasagar/kizami-web:latest
          ports:
            - name: web-http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: worker
          # api と同じイメージ(tsx でソースを直接実行する構成は api と共通、
          # docker/api.Dockerfile 参照)。エントリポイントだけ worker.ts に差し替える。
          image: ghcr.io/sasagar/kizami-api:latest
          command: ["node_modules/.bin/tsx", "src/worker.ts"]
          env:
            # api コンテナと同じ PVC 上の SQLite ファイルを見る(打刻忘れ検知は
            # DB の定期スキャンなので api と同じデータを読む必要がある)。
            - name: DATABASE_URL
              value: file:/data/kizami.db
            - name: REDIS_URL
              value: redis://kizami-valkey:6379
            # REMINDER_INTERVAL_MINUTES は未設定=既定 15 分のまま。
            # WEBHOOK_URL は任意。Secret 未作成でも起動できるよう optional 参照にする
            # (deploy/k8s/README.md の手順で kizami-notify Secret を作ると有効になる)。
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: kizami-notify
                  key: webhookUrl
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kizami-data
