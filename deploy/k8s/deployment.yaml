# api + web + worker(打刻忘れリマインドの定期スキャン, apps/api/src/worker.ts)を
# 同一 Pod にまとめたシングル Deployment。
# SQLite ファイルDB + RWO の PVC のため replicas は 1 固定、更新戦略も
# Recreate(RollingUpdate だと新旧 Pod が同時に same PVC を掴もうとして
# 片方が Pending のまま詰まる)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kizami
  namespace: kizami
  labels:
    app: kizami
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kizami
  template:
    metadata:
      labels:
        app: kizami
    spec:
      # local-path が新規プロビジョニングする PVC はデフォルト root 所有
      # になるため、api コンテナ内の非 root ユーザー(uid/gid 1001,
      # docker/api.Dockerfile 参照)から /data に書き込めるよう
      # fsGroup を合わせておく(k8s がマウント時にグループ所有権を付け替える)。
      securityContext:
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/sasagar/kizami-api:latest
          ports:
            - name: api-http
              containerPort: 3001
          env:
            - name: DATABASE_URL
              value: file:/data/kizami.db
            # COOKIE_SECURE は未設定=既定 true(Secure Cookie)のまま。
            # Cloudflare Tunnel 経由(HTTPS)前提のため既定を維持する。
            # TRUST_PROXY も未設定=既定 true。認証系のレート制限が CF-Connecting-IP /
            # X-Forwarded-For をクライアント IP として信用する(この配備は Cloudflare Tunnel
            # 経由が前提なので信用してよい)。API を直接インターネットへ晒す配備では
            # TRUST_PROXY=false にすること(本 README「認証系のレート制限」節)。
            # 秘密情報(tenant_notification_settings の webhookUrl・smtpPassword)の暗号化に
            # 必須の鍵(32バイトを base64 で表現)。optional: false — 鍵は必須運用にする
            # (未設定だと settings.ts の PUT が秘密情報の保存を 503 で拒否する。生成手順は
            # 本 README の「秘密情報の暗号化鍵」参照)。
            - name: KIZAMI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-encryption
                  key: key
                  optional: false
            # ブラウザプッシュ通知(Web Push、任意。docs/design/web-push.md)。
            # 3つ揃っている場合だけ有効になり、未設定なら購読 API が 404 を返し Web UI からも
            # プッシュ通知の項目が消える(optional: true — 使わない配備では Secret ごと不要)。
            # 生成: `pnpm generate-vapid`(本 README の「ブラウザプッシュ通知」参照)。
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: publicKey
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: privateKey
                  optional: true
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: subject
                  optional: true
            # 可観測性(任意。../../docs/design/observability.md)。どちらも
            # optional: true — Secret が無ければ環境変数が付かず、機能ごと無効になる。
            #
            # METRICS_TOKEN: Prometheus の GET /metrics に必要な Bearer トークン。
            # **未設定なら /metrics は 404**(既定で口を開けない)。作成例は本 README の
            # 「メトリクスとエラー報告」節。
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kizami-metrics
                  key: token
                  optional: true
            # SENTRY_DSN: エラー報告(Sentry 互換)の送り先。自前の sentry-relay /
            # GlitchTip / Bugsink を想定。**未設定なら外部へは何も出ていかない**。
            # server_name は未設定なら HOSTNAME(= Pod 名)へ自動で落ちる。
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: kizami-sentry
                  key: dsn
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: web
          image: ghcr.io/sasagar/kizami-web:latest
          ports:
            - name: web-http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: worker
          # api と同じイメージ(tsx でソースを直接実行する構成は api と共通、
          # docker/api.Dockerfile 参照)。エントリポイントだけ worker.ts に差し替える。
          image: ghcr.io/sasagar/kizami-api:latest
          command: ["node_modules/.bin/tsx", "src/worker.ts"]
          env:
            # api コンテナと同じ PVC 上の SQLite ファイルを見る(打刻忘れ検知は
            # DB の定期スキャンなので api と同じデータを読む必要がある)。
            - name: DATABASE_URL
              value: file:/data/kizami.db
            # Valkey は同一 Pod 内のサイドカー(下記)。Service 経由にしないのは、
            # クラスタDNS/ClusterIP がノードをまたぐと解決できない環境でも動かすため
            # (キューは起動トリガーでしかなく、正しさは DB の定期スキャンが担保する)
            - name: REDIS_URL
              value: redis://127.0.0.1:6379
            # REMINDER_INTERVAL_MINUTES は未設定=既定 15 分のまま。
            # WEBHOOK_URL は任意。Secret 未作成でも起動できるよう optional 参照にする
            # (deploy/k8s/README.md の手順で kizami-notify Secret を作ると有効になる)。
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: kizami-notify
                  key: webhookUrl
                  optional: true
            # api コンテナと同じ鍵。DB の webhookUrl・smtpPassword は暗号化されて保存されている
            # ため、通知チャネル組み立て時の復号にもこの鍵が要る(optional: false)。
            - name: KIZAMI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-encryption
                  key: key
                  optional: false
            # ブラウザプッシュ通知(Web Push、任意。docs/design/web-push.md)。
            # api コンテナと同じ値を渡すこと(購読の受付は api、実際の送信はこの worker が行う)。
            # 未設定なら個人設定で ON になっていてもプッシュは送られない(optional: true)。
            # 生成: `pnpm generate-vapid`(本 README の「ブラウザプッシュ通知」参照)。
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: publicKey
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: privateKey
                  optional: true
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: kizami-vapid
                  key: subject
                  optional: true
            # エラー報告(任意)。api と同じ Secret を参照する — 定期スキャンの失敗も
            # 同じ受け口へ送りたいため(../../docs/design/observability.md)。
            # メトリクス用のポートは worker には開けない: worker は心拍を DB
            # (worker_heartbeats)へ書き、api の /metrics がそれを読んで出す。
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: kizami-sentry
                  key: dsn
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        # ワーカー用のキュー。永続化なし(再起動で消えても、次のスキャンで
        # repeatable job が貼り直され、通知の重複は notifications の UNIQUE が防ぐ)
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kizami-data
