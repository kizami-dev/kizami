apiVersion: v1
kind: Service
metadata:
  name: kizami-web
  namespace: kizami
spec:
  type: NodePort
  selector:
    app: kizami
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30093
---
apiVersion: v1
kind: Service
metadata:
  name: kizami-api
  namespace: kizami
spec:
  type: NodePort
  selector:
    app: kizami
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30094
