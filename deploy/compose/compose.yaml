# KIZAMI をワンコマンドで動かす配布用 Compose(小規模セルフホスト向けの参考構成)。
#
#   cp .env.example .env   # KIZAMI_ENCRYPTION_KEY と初期管理者を設定
#   docker compose up -d
#   docker compose run --rm seed   # 初回のみ: 初期管理者を作成(冪等)
#   → 2社目以降のテナントを足す場合は下記 create-tenant サービスを使う
#   → http://localhost:8080
#
# 構成のポイント:
# - web の本番ビルドは同一オリジンの /api/* を叩く前提(docker/web.Dockerfile の
#   WAKU_PUBLIC_API_URL=/api 焼き込み)のため、前段の Caddy が / → web、/api/* → api に
#   振り分ける。API を別オリジンにしたい場合は web イメージの再ビルドが必要。
# - DB は SQLite ファイル(named volume)。バックアップは `sqlite3 ... ".backup"` の整合コピーを
#   推奨(WAL があるため生 cp は不可)。k8s 構成や運用の詳細は ../k8s/README.md を参照。
#   PostgreSQL を使いたい場合はファイル末尾の「PostgreSQL 構成」を参照(既定は SQLite のまま)。
# - worker は api と同じイメージで src/worker.ts を実行(リマインダー・乖離通知・有給予告の
#   日次スキャン)。キューは Valkey(永続化なし — ジョブは毎日再スケジュールされるため)。
# - イメージタグは .env の KIZAMI_TAG(既定 latest)。**本番運用では版タグの固定を推奨**
#   (例 KIZAMI_TAG=0.7.0)。latest は毎リリース中身が変わるため、意図しないタイミングで
#   アップグレードが起きる。使い分けとアップグレード手順は ../../docs/design/release-process.md。
# - ブラウザプッシュ通知(Web Push)を使う場合は VAPID_* を api / worker の両方に設定する
#   (下記)。任意機能で、未設定なら Web UI からプッシュ通知の項目が消えるだけ。
# - 監視(Prometheus の /metrics・Sentry 互換のエラー報告)は既定 OFF。有効化は
#   METRICS_TOKEN / SENTRY_DSN を .env で設定する(../../docs/design/observability.md)。
name: kizami
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "${KIZAMI_HTTP_PORT:-8080}:8080"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on: [web, api]
    restart: unless-stopped
  web:
    image: ghcr.io/kizami-dev/kizami-web:${KIZAMI_TAG:-latest}
    restart: unless-stopped
  api:
    image: ghcr.io/kizami-dev/kizami-api:${KIZAMI_TAG:-latest}
    environment:
      DATABASE_URL: file:/data/kizami.db
      KIZAMI_ENCRYPTION_KEY: ${KIZAMI_ENCRYPTION_KEY:?openssl rand -base64 32 で生成して .env に設定してください}
      # ブラウザプッシュ通知(Web Push、任意。../../docs/design/web-push.md)。
      # `pnpm generate-vapid` で3つ生成して .env に置く。api と worker の両方に同じ値が要る
      # (購読の受付は api、送信は worker)。未設定なら Web UI からプッシュ通知の項目が消えるだけで
      # 他の機能には影響しない。鍵を入れ替えると既存の購読はすべて無効になる点に注意。
      VAPID_PUBLIC_KEY: ${KIZAMI_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${KIZAMI_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${KIZAMI_VAPID_SUBJECT:-}
      # 可観測性(任意。../../docs/design/observability.md)。既定はどちらも空 = 無効。
      # METRICS_TOKEN: Prometheus 用の Bearer トークン。**空なら GET /metrics は 404**。
      #   有効にする場合は .env に `openssl rand -hex 32` の値を置き、Prometheus 側に
      #   `authorization: {type: Bearer, credentials: ...}` を書く。
      #   Caddy は /api/* を api へ通すので、スクレイプ先は http://<host>:8080/api/metrics。
      #   **公開ポートに出す構成では、前段で /api/metrics を社内からのみ許可すること**
      #   (トークンで守ってはいるが、外に晒す必然性が無い)。
      METRICS_TOKEN: ${KIZAMI_METRICS_TOKEN:-}
      # SENTRY_DSN: エラー報告(Sentry 互換)の送り先。自前の sentry-relay / GlitchTip /
      #   Bugsink を想定。空なら外部へは何も出ていかない。
      SENTRY_DSN: ${KIZAMI_SENTRY_DSN:-}
      SENTRY_SERVER_NAME: ${KIZAMI_SENTRY_SERVER_NAME:-}
      SENTRY_ENVIRONMENT: ${KIZAMI_SENTRY_ENVIRONMENT:-}
    volumes:
      - data:/data
    restart: unless-stopped
  worker:
    image: ghcr.io/kizami-dev/kizami-api:${KIZAMI_TAG:-latest}
    command: ["node_modules/.bin/tsx", "src/worker.ts"]
    environment:
      DATABASE_URL: file:/data/kizami.db
      REDIS_URL: redis://valkey:6379
      KIZAMI_ENCRYPTION_KEY: ${KIZAMI_ENCRYPTION_KEY:?openssl rand -base64 32 で生成して .env に設定してください}
      # Slack/Discord 互換 Webhook(テナント共有の管理者向け通知)。未設定なら Webhook 送信はスキップされる。
      WEBHOOK_URL: ${KIZAMI_WEBHOOK_URL:-}
      # ブラウザプッシュ通知の VAPID 鍵。api と同じ値を渡すこと(実際の送信はこの worker が行う)。
      VAPID_PUBLIC_KEY: ${KIZAMI_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${KIZAMI_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${KIZAMI_VAPID_SUBJECT:-}
      # 定期スキャンの失敗も api と同じ受け口へ送る(任意)。worker 側に /metrics は生えない —
      # スキャンの心拍は DB(worker_heartbeats)に書き、api の /metrics がそれを読んで出す。
      SENTRY_DSN: ${KIZAMI_SENTRY_DSN:-}
      SENTRY_SERVER_NAME: ${KIZAMI_SENTRY_SERVER_NAME:-}
      SENTRY_ENVIRONMENT: ${KIZAMI_SENTRY_ENVIRONMENT:-}
    volumes:
      - data:/data
    depends_on: [valkey, api]
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8-alpine
    command: ["--save", "", "--appendonly", "no"]
    restart: unless-stopped
  # 初回セットアップ専用(docker compose run --rm seed)。SEED_EMAIL のユーザーが既に居れば
  # 何もしない冪等実装なので、誤って再実行しても安全。権限カタログに項目が増えた
  # バージョンアップ後に再実行すると、システムプリセットへ新権限が追加同期される。
  seed:
    image: ghcr.io/kizami-dev/kizami-api:${KIZAMI_TAG:-latest}
    profiles: [setup]
    command: ["node_modules/.bin/tsx", "src/seed.ts"]
    environment:
      DATABASE_URL: file:/data/kizami.db
      SEED_EMAIL: ${KIZAMI_SEED_EMAIL:?初期管理者のメールアドレスを .env に設定してください}
      SEED_PASSWORD: ${KIZAMI_SEED_PASSWORD:?初期管理者のパスワードを .env に設定してください}
      SEED_TENANT_NAME: ${KIZAMI_SEED_TENANT_NAME:-}
    volumes:
      - data:/data
  # 2社目以降のテナント作成(docker compose run --rm create-tenant)。マルチテナント運用の
  # 唯一の作成経路で、セルフサインアップは提供しない(docs/design/multi-tenancy.md)。
  # TENANT_NAME のテナントに ADMIN_EMAIL のユーザーが既に居れば何もしない(冪等)。
  create-tenant:
    image: ghcr.io/kizami-dev/kizami-api:${KIZAMI_TAG:-latest}
    profiles: [setup]
    command: ["node_modules/.bin/tsx", "src/create-tenant.ts"]
    environment:
      DATABASE_URL: file:/data/kizami.db
      TENANT_NAME: ${KIZAMI_TENANT_NAME:-}
      ADMIN_EMAIL: ${KIZAMI_TENANT_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${KIZAMI_TENANT_ADMIN_PASSWORD:-}
    volumes:
      - data:/data
configs:
  caddyfile:
    content: |
      :8080 {
        handle /api/* {
          reverse_proxy api:3001
        }
        handle {
          reverse_proxy web:3000
        }
      }
volumes:
  data:

# ---------------------------------------------------------------------------
# PostgreSQL 構成(任意 / 既定は上記の SQLite のまま)
# ---------------------------------------------------------------------------
# KIZAMI は DATABASE_URL のスキームだけでダイアレクトを切り替える
# (docs/design/db-dialects.md)。PostgreSQL にする場合:
#
#  1. 下の db サービスのコメントを外す
#  2. api / worker / seed / create-tenant の DATABASE_URL を
#       postgres://kizami:${KIZAMI_DB_PASSWORD}@db:5432/kizami
#     に置き換える(4箇所すべて)
#  3. 同じ4サービスの `volumes: - data:/data` を削除する(SQLite ファイル用なので不要)
#  4. api / worker / seed / create-tenant に `depends_on: [db]` を足す
#  5. 末尾の `volumes:` に `pgdata:` を足す
#
# マイグレーションは起動時に自動適用される(migrations-pg/)。追加設定は不要。
#
# 既存の SQLite 運用からの切り替えなら、DATABASE_URL を差し替える前にデータを移す
# (docs/design/db-dialects.md「SQLite → PostgreSQL のデータ移行」)。
# api / worker を止めてから、data ボリュームを付けた使い捨てコンテナで:
#
#   docker compose stop api worker
#   docker compose up -d db
#   docker compose run --rm -v <compose プロジェクト名>_data:/data api \
#     node_modules/.bin/tsx ../../packages/db/src/migrate-data-cli.ts \
#       --from file:/data/kizami.db \
#       --to postgres://kizami:${KIZAMI_DB_PASSWORD}@db:5432/kizami \
#       --i-stopped-the-app
#
# (-v が要るのは、上の 3. で api から data ボリュームを外しているため。
#  ボリューム名は `docker volume ls` で確認できる)
#
# 移行先は空でなければならない(空でなければツールが拒否する)。コピー元の SQLite は
# 読むだけなので、切り戻しは DATABASE_URL を file:/data/kizami.db に戻すだけでよい。
#
#   db:
#     image: postgres:17-alpine
#     environment:
#       POSTGRES_DB: kizami
#       POSTGRES_USER: kizami
#       POSTGRES_PASSWORD: ${KIZAMI_DB_PASSWORD:?PostgreSQL 構成では .env に設定してください}
#     volumes:
#       - pgdata:/var/lib/postgresql/data
#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -U kizami -d kizami"]
#       interval: 5s
#       retries: 10
#     restart: unless-stopped
