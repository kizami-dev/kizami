# deploy/k8s/deployment.yaml を helm 化したもの。判断コメントはそちらを参照。
# replicas 1 + Recreate は SQLite/RWO PVC の制約(values.yaml 冒頭コメント)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      securityContext: {fsGroup: 1001}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: api-http, containerPort: 3001}]
          env:
            - {name: DATABASE_URL, value: "file:/data/kizami.db"}
            - name: KIZAMI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionSecret.name }}
                  key: {{ .Values.encryptionSecret.key }}
            {{- if .Values.vapidSecret.name }}
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.publicKeyKey }}
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.privateKeyKey }}
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.subjectKey }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: 3001}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: web-http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
        - name: worker
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node_modules/.bin/tsx", "src/worker.ts"]
          env:
            - {name: DATABASE_URL, value: "file:/data/kizami.db"}
            - {name: REDIS_URL, value: "redis://127.0.0.1:6379"}
            - name: KIZAMI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionSecret.name }}
                  key: {{ .Values.encryptionSecret.key }}
            {{- if .Values.notifySecret.name }}
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notifySecret.name }}
                  key: {{ .Values.notifySecret.key }}
            {{- end }}
            {{- if .Values.vapidSecret.name }}
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.publicKeyKey }}
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.privateKeyKey }}
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vapidSecret.name }}
                  key: {{ .Values.vapidSecret.subjectKey }}
            {{- end }}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: valkey
          image: "{{ .Values.image.valkey.repository }}:{{ .Values.image.valkey.tag }}"
          args: ["--save", "", "--appendonly", "no"]
          ports: [{name: valkey, containerPort: 6379}]
          resources: {{- toYaml .Values.resources.valkey | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
