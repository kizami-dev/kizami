<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KIZAMI">
  <!-- KIZAMIロゴマーク(トンボ+時計の針)。確定ソース: icons/source/kizami-mark.svg
       12時=K(黒/ダーク対応)、右回りにC(3時)→M(6時)→Y(9時)。詳細: docs/design/ui-direction.md -->
  <style>
    .k-ink { stroke: #1A1A1A; }
    @media (prefers-color-scheme: dark) {
      .k-ink { stroke: #F2F2EE; }
    }
  </style>
  <g stroke-width="5" fill="none" stroke-linecap="square">
    <line x1="32" y1="2" x2="32" y2="18" class="k-ink"/>
    <line x1="62" y1="32" x2="46" y2="32" stroke="#00A3D9"/>
    <line x1="32" y1="62" x2="32" y2="46" stroke="#E5007E"/>
    <line x1="2" y1="32" x2="18" y2="32" stroke="#FFD400"/>
    <circle cx="32" cy="32" r="16" class="k-ink"/>
  </g>
  <g class="k-ink" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="32" x2="41.5" y2="26.5"/>
    <line x1="32" y1="32" x2="41.5" y2="37.5"/>
  </g>
</svg>
